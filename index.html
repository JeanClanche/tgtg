<!DOCTYPE html>
<html lang="fr">
    <head>        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Too Good To Go</title>
        <link rel="icon" type="image/x-icon" href="img/logo.png">

        <link rel="stylesheet" href="bootstrap-5.3.8/css/bootstrap.css">
        <link rel="stylesheet" href="custom.css">
        
        <script src="fontawesome-7.3.1/js/all.js"></script>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row p-2">
                <div class="col-2">
                    <span class="badge rounded-circle gris text-dark p-2">
                        <i class="fa-solid fa-arrow-left"></i>
                    </span>
                </div>
                <div class="col">
                    <span class="fw-bold">Votre réservation</span>
                </div>
            </div>

            <hr class="mt-1">

            <div id="exp" class="row rounded m-0 text-center text-light py-2 mb-3 justify-content-center">
                <div class="row">
                    <span class="" id="expTxt">Comment s'est passée votre expérience globale ?</span>
                </div>
                
                <div class="row justify-content-center">
                    <div class="col my-2 fs-4">
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                    </div>
                </div>
            </div>

            <div id="recap" class="row text-center m-0 rounded justify-content-center p-1 pt-0 mb-4">
                <span class="text-light my-1">
                    <i class="fa-solid fa-circle-check"></i>
                    Récupérée
                </span>
                <div class="row bg-light rounded">
                    <div class="col">
                        <div class="row p-3">
                            <div class="col-2 text-end align-self-center">
                                <span class="badge rounded-circle bg-secondary p-2 fs-4">
                                    <i class="fa-brands fa-google"></i>
                                </span>
                            </div>
                            <div class="col text-start">
                                <div class="row">
                                    <span class="fw-bold">Carrefour City - Le Havre</span>
                                </div>
                                <div class="row">
                                    <span class="">
                                        18 rue du marché, Le Havre
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold">RÉCUPÉRÉE</span>
                                </div>
                                <div class="row">
                                    <span>01 juin 2052</span>
                                </div>
                            </div>
                            <div class="col text-end">
                                <div class="row">
                                    <span class="titreRecap fw-bold">N° DE COMMANDE</span>
                                </div>
                                <div class="row">
                                    <span class="text-lowercase">UIZUDGI</span>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold">PANIER SURPRISE</span>
                                </div>
                                <div class="row">
                                    <span>2 x Panier Mixte</span>
                                </div>
                            </div>
                            <div class="col text-end">
                                <div class="row">
                                    <span class="titreRecap fw-bold">TOTAL</span>
                                </div>
                                <div class="row">
                                    <span class="text-lowercase">67,00 €</span>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold">MOYEN DE PAIEMENT</span>
                                </div>
                                <div class="row">
                                    <span>Credit Card: Mastercard</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col text-center">
                    <div class="row">
                        <span>
                            <i class="fa-solid fa-headset"></i>
                        </span>
                    </div>
                    <div class="row">
                        <span>
                            Besoin d'aide ?
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>
