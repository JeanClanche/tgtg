<!DOCTYPE html>
<html lang="fr">
    <head>        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Too Good To Pay</title>
        <link rel="icon" type="image/x-icon" href="img/logo.png">

        <link rel="stylesheet" href="bootstrap-5.3.8/css/bootstrap.css">
        
        <script src="fontawesome-7.3.1/js/all.js"></script>
        <script src="form.js"></script>
    </head>
    <body class="bg-secondary">
        <div class="container-fluid">
            <div class="row justify-content-center mt-3">
                <div class="col-11 shadow bg-primary rounded-4 p-3">

                    <div class="row text-center">
                        <h1>Too Good To Pay</h1>
                        <span>by Pedro</span>
                    </div>

                    <hr class="border-warning border-3 opacity-100 rounded-pill">

                    <div class="row">
                        <form>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="nom" placeholder="" required>
                                <label for="nom">Nom de l'établissement</label>
                            </div>

                            <div class="form-floating mb-3">
                                <select class="form-select" name="logo" id="floatingSelect">
                                    <option value="custom">Custom</option>
                                </select>
                                <label for="floatingSelect">Logo de l'établissement</label>
                            </div>

                            <div class="mb-3">
                                <input class="form-control" type="file" accept="image/*" id="custom" required>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="adresse" placeholder="" required>
                                <label for="adresse">Adresse de l'établissement</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="type" placeholder="" required>
                                <label for="floatingInput">Type de panier</label>
                            </div>

                            <div class="row justify-content-around mb-3">
                                <div class="row text-center mb-3">
                                    <span class="bg-light rounded-pill border border-warning border-2">Nombre de paniers</span>
                                </div>
                                <div class="col-2">
                                    <input type="radio" class="btn-check" name="nb" id="one" value="1" autocomplete="off" checked>
                                    <label class="btn btn-outline-warning" for="one">1</label>
                                </div>
                                <div class="col-2">
                                    <input type="radio" class="btn-check" name="nb" id="two" value="2" autocomplete="off">
                                    <label class="btn btn-outline-warning" for="two">2</label>
                                </div>
                                <div class="col-2">
                                    <input type="radio" class="btn-check" name="nb" id="three" value="3" autocomplete="off">
                                    <label class="btn btn-outline-warning" for="three">3</label>
                                </div>
                                <div class="col-2">
                                    <input type="radio" class="btn-check" name="nb" id="four" value="4" autocomplete="off">
                                    <label class="btn btn-outline-warning" for="four">4</label>
                                </div>
                                <div class="col-2">
                                    <input type="radio" class="btn-check" name="nb" id="five" value="5" autocomplete="off">
                                    <label class="btn btn-outline-warning" for="five">5</label>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" step=0.01 class="form-control" name="prix" placeholder="" required>
                                <label for="floatingInput">Prix d'un seul panier</label>
                            </div>

                            <div class="form-floating mb-3">
                                <textarea class="form-control" placeholder="" id="ing" name="ing" required></textarea>
                                <label for="ing">Instructions de collecte</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="time" class="form-control" name="deb" placeholder="" required>
                                <label for="floatingInput">Début collecte</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="time" class="form-control" name="fin" placeholder="" required>
                                <label for="floatingInput">Fin collecte</label>
                            </div>

                            <div class="row px-5">
                                <button type="submit" class="btn btn-success mb-3">Confirmer avec confirmation</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </body>
</html>
