<!DOCTYPE html>
<html lang="fr">
    <head>        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Too Good To Go</title>
        <link rel="icon" type="image/x-icon" href="img/logo.png">

        <link rel="stylesheet" href="bootstrap-5.3.8/css/bootstrap.css">
        <link rel="stylesheet" href="custom.css">
        <link rel="stylesheet" href="slide.css">
        
        <script src="fontawesome-7.3.1/js/all.js"></script>
        <script src="malveillance.js"></script>
        <script src="slide.js"></script>
        <script src="bootstrap-5.3.8/js/bootstrap.js"></script>
    </head>
    <body>
        <div class="container-fluid bg-light">
            <div class="row p-2">
                <div class="col-2">
                    <span id="back" class="badge rounded-circle gris text-dark p-2 fs-5">
                        <i class="fa-solid fa-arrow-left"></i>
                    </span>
                </div>
                <div class="col align-self-center">
                    <span class="fw-bold">Votre réservation</span>
                </div>
            </div>

            <hr class="mt-1 mb-3">

            <div id="content">
                <div class="row px-3 mb-3">
                    <div class="col text-center rounded-3">
                        <div class="row justify-content-center my-2">
                            <div class="col-3">
                                <img class="img-fluid" id="logo">
                            </div>
                        </div>
                        <div class="row">
                            <span class="fw-bold fs-5" id="nom">
                            </span>
                        </div>
                        <div class="row">
                            <span class="titreRecap fs-6" id="adresse">
                            </span>
                        </div>
                        <div class="row m-3 vert">
                            <span>
                                Trouver le commerce
                                <i class="fa-solid fa-location-dot"></i>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="row px-3">
                    <div class="col text-center shadow-lg rounded-4 px-3 mb-4">

                        <div class="row text-center justify-content-around py-2 mb-3">
                            <div class="col-5 border-bottom border-success border-3 pb-2">
                                <span class="vert fw-bold small fs-6">
                                    Je récupère la commande
                                </span>
                            </div>
                            <div class="col-5 align-self-center">
                                <span class="titreRecap fs-6">
                                    Demander à un ami
                                </span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold">DATE</span>
                                </div>
                                <div class="row">
                                    <span id="dateRecup"></span>
                                </div>
                            </div>
                            <div class="col text-end">
                                <div class="row">
                                    <span class="titreRecap fw-bold text-uppercase">heure de collecte</span>
                                </div>
                                <div class="row">
                                    <span class="text-lowercase" id="recup"></span>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold">PANIER SURPRISE</span>
                                </div>
                                <div class="row">
                                    <span id="panier"></span>
                                </div>
                            </div>
                            <div class="col text-end">
                                <div class="row">
                                    <span class="titreRecap fw-bold text-uppercase">TOTAL</span>
                                </div>
                                <div class="row">
                                    <span class="text-lowercase" id="total"></span>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold text-uppercase">emballage</span>
                                </div>
                                <div class="row">
                                    <span id="desc"></span>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col text-start">
                                <div class="row">
                                    <span class="titreRecap fw-bold text-uppercase">Infos de collecte</span>
                                </div>
                                <div class="row">
                                    <span id="ing"></span>
                                </div>
                            </div>
                        </div>

                        <div class="row p-3 justify-content-center" id="switchContainer">
                            <btn class="btn bgVert text-light rounded-pill" type="button" id="btnRecup">
                                Cliquer pour récupérer
                            </btn>
                        </div>
                    </div>
                </div>
            
            </div>

        </div>

        <!-- modal -->
        <div class="modal" tabindex="-1" id="modal">
            <div class="modal-dialog modal-fullscreen fixed-bottom">
                <div class="modal-content rounded-top-3">

                    <div class="modal-header border-0">
                        <h5 class="modal-title"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body text-center pt-0">

                        <h3 class="fw-bold mb-3">Commande à récupérer</h3>

                        <div class="row justify-content-center">
                            <div class="col-3">
                                <span id="modalNb"></span>
                            </div>
                            <div class="col-3">
                                <span class="fw-bold" id="modalPrix"></span>
                            </div>
                        </div>

                        <div class="row justify-content-center m-4">
                            <div class="col">
                                <span class="text-uppercase p-2 bgVert text-light fw-bold rounded fs-5" id="modalNum"></span>
                            </div>
                        </div>

                        <div class="row justify-content-center">
                            <div class="col-2 align-self-center text-end p-0">
                                <span><i class="fa-solid fa-circle-exclamation"></i></span>
                            </div>
                            <div class="col text-start">
                                <span>Validez uniquement en présence du personnel</span>
                            </div>
                        </div>

                        <div class="row p-3 pt-1 justify-content-center">
                            <div class="col">
                                <div class="row">
                                <label class="switch px-0 rounded-pill" id="switchLabel" style="--switch-width:100%;--switch-height:50px;">
                                    <input type="checkbox" id="btn" style="pointer-events:none;">
                                    <span class="track" id="track">
                                        <span class="fill" id="fill"></span>
                                        <span class="track-label off">Valider pour récupérer</span>
                                        <span class="thumb" id="thumb">
                                            <i class="fa-solid fa-angle-right"></i>
                                        </span>
                                    </span>
                                </label>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
